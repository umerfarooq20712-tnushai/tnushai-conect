
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#05020B">

    <title>TNUSHAI,CONECT</title>

    <link rel="stylesheet" href="/assets/style.css">
</head>

<body>

    <header>
        <h1>TNUSHAI,CONECT</h1>
        <p>PRIVATE NETWORK • SECURE FILE TRANSFER</p>

        <button id="theme-toggle"
            class="theme-toggle-button"
            aria-label="Toggle theme">
            <span id="theme-icon">🌙</span>
        </button>
    </header>

    <main>

        <section id="upload-section">

            <div id="section-header-with-button"
                class="header-container">

                <h2>Upload Files</h2>

                <button id="paste-button"
                    class="icon-button"
                    title="Paste from Clipboard">

                    <svg xmlns="http://www.w3.org/2000/svg"
                        viewBox="0 0 24 24"
                        fill="currentColor">

                        <path d="M19 2h-4.18C14.4 1.18 13.23 0.5 12 0.5S9.6 1.18 9.18 2H5c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2ZM12 2.5a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3ZM19 20H5V4h2v3h10V4h2v16Z"/>

                    </svg>
                </button>

            </div>

            <div id="drop-zone">
                <p>✦ Select files to share across your network ✦</p>
                <input type="file" id="file-input" multiple>
            </div>

            <div id="upload-progress-container">
            </div>

        </section>


        <section id="files-section">

            <div id="files-header-container"
                class="header-container">

                <h2>Shared Files</h2>

                <div id="files-actions">
                    <button id="download-all-zip-button"
                        style="display: none;">
                        Download All as ZIP
                    </button>
                </div>

            </div>

            <div class="table-container">

                <table id="files-table">

                    <thead>
                        <tr>
                            <th>
                                <input type="checkbox"
                                    id="select-all-checkbox">
                            </th>
                            <th>Name</th>
                            <th>Size</th>
                            <th>Last Modified</th>
                            <th>Type</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody>
                    </tbody>

                </table>

            </div>

            <p id="no-files-message" style="display:none;">
                No files found in the shared folder.
            </p>

        </section>

    </main>


    <footer>
        <p>TNUSHAI,CONECT</p>
        <p>PRIVATE • LOCAL • CONNECTED</p>
        <small>Original project: Transfer by matan-h</small>
    </footer>


    <div id="confirmation-modal-overlay"
        class="modal-overlay">

        <div class="modal-content">

            <p id="confirmation-modal-message"></p>

            <div class="modal-checkbox-container">

                <input type="checkbox"
                    id="do-not-ask-again">

                <label for="do-not-ask-again">
                    Don't ask me again
                </label>

            </div>

            <div class="modal-buttons">

                <button id="modal-confirm-button"
                    class="delete-button">
                    Delete
                </button>

                <button id="modal-cancel-button">
                    Cancel
                </button>

            </div>

        </div>

    </div>


    <script src="/assets/script.js"></script>

</body>
</html>
